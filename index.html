<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet.io — La petite salle</title>
<style>
  body { margin: 2rem; background: #171e19; color: #e7efd9; font: 1rem system-ui, sans-serif; }
  a { color: #d4ff73; }
</style>
</head>
<body>
<main>
  <p id="status" role="status">Chargement de Pet.io…</p>
  <p id="retry" hidden><a href="./">Réessayer</a></p>
  <noscript><p>Active JavaScript pour jouer à Pet.io.</p></noscript>
</main>
<script>
'use strict';

async function loadGame() {
  const url = new URL('./game.html', location.href);
  url.searchParams.set('v', Date.now().toString(36));
  if (location.protocol === 'file:') {
    location.replace(url);
    return;
  }

  let html;
  try {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    html = await response.text();
  } catch {
    document.getElementById('status').textContent = 'Pet.io est temporairement indisponible.';
    document.getElementById('retry').hidden = false;
    return;
  }

  // Keep the public URL stable while parsing the freshly fetched game.
  window.petioLoadVersion = url.searchParams.get('v');
  document.open();
  document.write(html);
  document.close();
}

loadGame();
</script>
</body>
</html>
